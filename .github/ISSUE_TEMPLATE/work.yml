name: Project work
description: 모든 개발·검수·배포 작업의 정본 이슈
title: "[project] "
labels: [work]
body:
  - type: textarea
    id: outcome
    attributes:
      label: 원하는 결과
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 확인 방법과 완료 조건
    validations:
      required: true
  - type: dropdown
    id: contribution_type
    attributes:
      label: 기여 유형
      options:
        - 코드
        - 문서
        - 번역
        - 데모
        - 운영 자료
    validations:
      required: true
  - type: input
    id: assignee_alias
    attributes:
      label: 담당자 별칭
      description: GitHub handle과 같은 소문자 별칭을 스스로 정합니다(형식 ^[a-z0-9][a-z0-9_-]{1,31}$). 운영진이 .runtime 등록부에 등록합니다.
      placeholder: "예: community-contributor"
    validations:
      required: true
  - type: input
    id: issue_branch
    attributes:
      label: 이슈 브랜치
      placeholder: "예: issue/123-short-name"
    validations:
      required: true
  - type: input
    id: availability
    attributes:
      label: 연락 가능 시간과 응답 기대 시간
      placeholder: "예: 평일 10:00–18:00 KST / 다음 영업일 응답"
    validations:
      required: true
  - type: input
    id: mutation_window
    attributes:
      label: 실제 변경 허용 시간창
      placeholder: "예: 2026-09-10 14:00–16:00 KST"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 배포 필요 여부
      options:
        - 배포 없음
        - 운영 배포 필요(소유자 확인)
    validations:
      required: true
  - type: textarea
    id: validation_reproduction
    attributes:
      label: 검증 명령과 재현 절차
      description: 다른 참여자가 같은 결과를 확인할 수 있는 명령과 문서 경로를 적습니다.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 영향 범위와 되돌리기
    validations:
      required: true
  - type: checkboxes
    id: gate
    attributes:
      label: 작업 전 확인
      options:
        - label: 개인 브랜치에서 작업하며 main 병합 전 운영 배포나 DB 변경을 하지 않습니다.
          required: true
