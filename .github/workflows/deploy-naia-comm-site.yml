name: Deploy naia-comm survey site

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Exact 40-character commit SHA on main to deploy"
        required: true
        type: string
      issue:
        description: "GitHub issue number for this production release"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
      - name: Verify release owner and main revision
        env:
          RELEASE_OWNERS: ${{ vars.NAIA_COMM_RELEASE_OWNERS }}
          REQUESTED_REVISION: ${{ inputs.revision }}
          ISSUE: ${{ inputs.issue }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -eu
          if ! printf '%s' "$ISSUE" | grep -Eq '^[0-9]+$'; then
            echo "release denied: issue must be a numeric GitHub issue number"
            exit 1
          fi
          printf 'Refs #%s\n' "$ISSUE" >> "$GITHUB_STEP_SUMMARY"
          if ! printf '%s' "$REQUESTED_REVISION" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "release denied: revision must be an exact 40-character lowercase commit SHA"
            exit 1
          fi
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "release denied: workflow must run from refs/heads/main"
            exit 1
          fi
          if [ -z "${RELEASE_OWNERS:-}" ]; then
            echo "release denied: repository variable NAIA_COMM_RELEASE_OWNERS is not configured"
            exit 1
          fi
          git fetch --no-tags origin main
          checked_revision="$(git rev-parse HEAD)"
          main_revision="$(git rev-parse refs/remotes/origin/main)"
          if [ "$checked_revision" != "$REQUESTED_REVISION" ] || [ "$main_revision" != "$REQUESTED_REVISION" ]; then
            echo "release denied: checkout and origin/main do not match the requested revision"
            exit 1
          fi
          is_release_owner() {
            candidate="$1"
            IFS=',' read -ra owner_entries <<< "$RELEASE_OWNERS"
            for owner in "${owner_entries[@]}"; do
              owner="$(printf '%s' "$owner" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              if [ -n "$owner" ] && [ "$owner" = "$candidate" ]; then
                return 0
              fi
            done
            return 1
          }
          if ! is_release_owner "$ACTOR" || ! is_release_owner "$TRIGGERING_ACTOR"; then
            echo "release denied: actor and triggering actor must both be configured release owners"
            exit 1
          fi
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "projects/naia-comm/site"
          api_location: "projects/naia-comm/site/api"
          output_location: ""
