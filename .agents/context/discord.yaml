version: 2
topology:
  default: manual_discussion_with_github_links
  bot_required: false
  coding_location: contributor_local_workspace
  issue_thread_mapping: one_thread_per_qualified_github_issue
routing:
  channel_thread:
    key: owner/repo#number
    purpose: [discussion, status, review_request, evidence_links]
  direct_message:
    grants_authority: false
    execution: disabled
behavior:
  decisions_and_validation_recorded_in_github: true
  discord_membership_required_for_contribution: false
  automatic_code_execution_from_public_messages: false
  confirmation_request_fields: [who, what, where_exactly, where_to_report_back]
optional_bot:
  implemented_here: false
  purpose: notification_only
  gateway_consumers_per_token: 1
  token_owner_lock: required
  duplicate_consumer_behavior: fail_closed
  permissions: minimum_channel_notification_permissions
  may_not: [execute_code, merge, deploy, access_contributor_workspace]
legacy_server_adapter:
  default_enabled: false
  adoption: separate_explicit_operator_design_and_authorization
  participant_schema: schemas/participants.schema.json
  runtime_registry: ignored
  tracked_registry: schema_only
audit:
  issue_records: [qualified_issue_key, decision_summary, evidence_link, commit_reference]
